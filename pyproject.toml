[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-lab"
version = "0.1.0"
requires-python = ">=3.9"
description = "LLM security lab — Exercise 2/3"
dependencies = ["fastapi>=0.124.4", "uvicorn>=0.54.0", "httpx>=0.28.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]